<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PastiAda</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50">

    <!-- Top Header & Main Header -->
    <!-- (Existing header code remains the same) -->

    <!-- Main Header -->
    <header class="main-header sticky top-0 bg-white z-20 shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="logo text-2xl font-bold text-gray-800">
                <i class="fas fa-store text-teal-500"></i> PastiAda
            </div>
            <div class="search-bar flex items-center border rounded-md">
                <div class="relative">
                    <button class="px-4 py-2 text-gray-600">Category <i class="fas fa-chevron-down text-xs"></i></button>
                </div>
                <input type="text" placeholder="Search..." class="pl-4 pr-10 py-2 w-64 focus:outline-none">
                <button class="px-4 text-gray-500 hover:text-teal-500">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="cart">
                <a href="#" id="cart-button" class="flex items-center space-x-2 text-gray-700 hover:text-teal-500">
                    <i class="fas fa-shopping-cart text-2xl text-teal-500"></i>
                    <div>
                        <span class="font-bold">KERANJANG</span><br>
                        <span id="cart-info" class="text-sm">(0) Barang - Rp 0</span>
                    </div>
                </a>
            </div>
        </div>
    </header>

    <!-- Product Section -->
    <main class="container mx-auto px-4 py-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Produk Kami</h2>
        <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Products will be loaded here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-6 mt-8">
        <div class="container mx-auto text-center">
            <p>&copy; 2024 PastiAda. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Cart Modal -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold">Keranjang Belanja</h3>
                <button id="close-cart-modal" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
            </div>
            <div id="cart-items-container" class="p-4 max-h-96 overflow-y-auto"></div>
            <div class="p-4 border-t">
                <div class="flex justify-between items-center font-bold text-lg">
                    <span>Total</span>
                    <span id="cart-modal-total">Rp 0</span>
                </div>
                <button id="proceed-to-shipping-button" class="mt-4 w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 font-bold disabled:bg-gray-400">
                    Lanjutkan ke Pengiriman
                </button>
            </div>
        </div>
    </div>

    <!-- Shipping Form Modal -->
    <div id="shipping-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mx-4">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold">Detail Pengiriman</h3>
                <button id="close-shipping-modal" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
            </div>
            <form id="shipping-form" class="p-4 space-y-4">
                <div>
                    <label for="nama" class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="telepon" class="block text-sm font-medium text-gray-700">Nomor Telepon (WhatsApp)</label>
                    <input type="tel" id="telepon" name="telepon" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="alamat" class="block text-sm font-medium text-gray-700">Alamat Lengkap</label>
                    <textarea id="alamat" name="alamat" rows="3" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div>
                    <label for="metode_pembayaran" class="block text-sm font-medium text-gray-700">Metode Pembayaran</label>
                    <select id="metode_pembayaran" name="metode_pembayaran" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Pilih Metode</option>
                        <option value="Transfer Bank">Transfer Bank</option>
                        <option value="COD (Bayar di Tempat)">COD (Bayar di Tempat)</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-4 pt-4">
                     <button type="button" id="back-to-cart-button" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">Kembali</button>
                    <button type="submit" id="checkout-wa-button" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 font-bold">
                        Kirim Pesanan via WhatsApp
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
